<script>
// Google Apps Script 雲端 API 網址
const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxlAvVig_0VZJ8s6hasbKE46LMnKVYN0HCmOtjXluLEC8J-xSowe2o5nEtfs__1Pw7w/exec";

// 音效合成器
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);

  const now = audioCtx.currentTime;
  if (type === 'jump') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(300, now);
    osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
    gain.gain.setValueAtTime(0.3, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
    osc.start(now); osc.stop(now + 0.15);
  } else if (type === 'spring') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(200, now);
    osc.frequency.linearRampToValueAtTime(700, now + 0.25);
    gain.gain.setValueAtTime(0.4, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
    osc.start(now); osc.stop(now + 0.25);
  } else if (type === 'hurt') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(150, now);
    osc.frequency.linearRampToValueAtTime(60, now + 0.2);
    gain.gain.setValueAtTime(0.4, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
    osc.start(now); osc.stop(now + 0.2);
  } else if (type === 'heal') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(400, now);
    osc.frequency.setValueAtTime(600, now + 0.08);
    osc.frequency.setValueAtTime(800, now + 0.16);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
    osc.start(now); osc.stop(now + 0.25);
  }
}

// Canvas & 遊戲狀態
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let gameState = 'MENU';
let selectedGender = 'boy';
let score = 0;
let highestFloor = 0;

// 控制變數
const GRAVITY = 0.35;
const PLAYER_SPEED = 1.62; 
const BASE_SCROLL_SPEED = 0.378; 
let currentScrollSpeed = BASE_SCROLL_SPEED;

let keys = { left: false, right: false };

let player = {
  x: 210,
  y: 100,
  vx: 0,
  vy: 0,
  width: 32,
  height: 44,
  hp: 9,
  maxHp: 9,
  invincibleTimer: 0, 
  onPlatform: null,
  facing: 'right',
  animFrame: 0,
  isMoving: false
};

let platforms = [];

window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
});
window.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
});

const btnLeft = document.getElementById('btn-left');
const btnRight = document.getElementById('btn-right');
btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); keys.left = true; });
btnLeft.addEventListener('touchend', (e) => { e.preventDefault(); keys.left = false; });
btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); keys.right = true; });
btnRight.addEventListener('touchend', (e) => { e.preventDefault(); keys.right = false; });

function selectChar(gender) {
  selectedGender = gender;
  document.getElementById('opt-boy').classList.toggle('selected', gender === 'boy');
  document.getElementById('opt-girl').classList.toggle('selected', gender === 'girl');
}

function startGame() {
  document.getElementById('start-menu').classList.add('hidden');
  document.getElementById('gameover-menu').classList.add('hidden');
  resetGame();
  gameState = 'PLAYING';
  requestAnimationFrame(gameLoop);
}

function restartGame() {
  document.getElementById('gameover-menu').classList.add('hidden');
  resetGame();
  gameState = 'PLAYING';
}

function resetGame() {
  score = 0;
  highestFloor = 1;
  currentScrollSpeed = BASE_SCROLL_SPEED;
  
  player.x = 210;
  player.y = 80;
  player.vx = 0;
  player.vy = 0;
  player.hp = 9;
  player.invincibleTimer = 0;
  player.onPlatform = null;

  platforms = [];
  platforms.push({
    x: 180,
    y: 180,
    width: 100,
    height: 16,
    type: 'NORMAL',
    floor: 1,
    springCompress: 0
  });

  let lastY = 180;
  for (let i = 2; i <= 8; i++) {
    lastY += 75;
    generatePlatform(lastY, i);
  }
}

function generatePlatform(yPos, floorNum) {
  const width = Math.random() * 20 + 85;
  const x = Math.random() * (canvas.width - width - 40) + 20;
  
  let type = 'NORMAL';
  const rand = Math.random();
  if (rand < 0.35) type = 'NORMAL';
  else if (rand < 0.50) type = 'SPRING';
  else if (rand < 0.65) type = 'CONVEYOR_LEFT';
  else if (rand < 0.80) type = 'CONVEYOR_RIGHT';
  else if (rand < 0.90) type = 'SPIKE';
  else if (rand < 0.96) type = 'BREAK';
  else type = 'HEAL';

  platforms.push({
    x: x,
    y: yPos,
    width: width,
    height: 16,
    type: type,
    floor: floorNum,
    broken: false,
    springCompress: 0
  });
}

function hurtPlayer() {
  if (player.invincibleTimer > 0) return;
  player.hp--;
  player.invincibleTimer = 180; 
  playSound('hurt');

  if (player.hp <= 0) {
    gameOver();
  }
}

function update() {
  if (gameState !== 'PLAYING') return;

  player.isMoving = false;
  if (keys.left) {
    player.vx = -PLAYER_SPEED;
    player.facing = 'left';
    player.isMoving = true;
  } else if (keys.right) {
    player.vx = PLAYER_SPEED;
    player.facing = 'right';
    player.isMoving = true;
  } else {
    player.vx = 0;
  }

  player.x += player.vx;
  if (player.x < 10) player.x = 10;
  if (player.x + player.width > canvas.width - 10) player.x = canvas.width - 10 - player.width;

  player.vy += GRAVITY;
  player.y += player.vy;

  if (player.invincibleTimer > 0) {
    player.invincibleTimer--;
  }

  currentScrollSpeed = BASE_SCROLL_SPEED + Math.min(highestFloor * 0.01, 0.5);
  
  let wasOnPlatform = player.onPlatform;
  player.onPlatform = null;

  for (let p of platforms) {
    if (p.springCompress > 0) {
      p.springCompress -= 0.1;
      if (p.springCompress < 0) p.springCompress = 0;
    }

    if (p.broken) continue;

    if (
      player.vy >= 0 &&
      player.x + player.width > p.x &&
      player.x < p.x + p.width &&
      player.y + player.height >= p.y &&
      player.y + player.height <= p.y + p.height + player.vy + 2
    ) {
      player.y = p.y - player.height;
      player.vy = 0;
      player.onPlatform = p;

      if (p.floor > highestFloor) {
        highestFloor = p.floor;
      }

      if (wasOnPlatform !== p) {
        if (p.type === 'SPRING') {
          p.springCompress = 1.0; 
          player.vy = -9.5;
          playSound('spring');
        } else if (p.type === 'SPIKE') {
          hurtPlayer();
        } else if (p.type === 'BREAK') {
          p.broken = true;
          playSound('hurt');
        } else if (p.type === 'HEAL') {
          if (player.hp < player.maxHp) {
            player.hp = Math.min(player.maxHp, player.hp + 2);
            playSound('heal');
          }
          p.type = 'NORMAL';
        }
      }

      if (p.type === 'CONVEYOR_LEFT') player.x -= 1.2;
      if (p.type === 'CONVEYOR_RIGHT') player.x += 1.2;

      break;
    }
  }

  for (let p of platforms) {
    p.y -= currentScrollSpeed;
  }
  player.y -= currentScrollSpeed;

  if (platforms.length > 0 && platforms[0].y < -30) {
    platforms.shift();
  }

  let lastP = platforms[platforms.length - 1];
  if (lastP.y < canvas.height - 60) {
    generatePlatform(lastP.y + 75 + Math.random() * 15, lastP.floor + 1);
  }

  if (player.y <= 24) {
    player.y = 25;
    player.vy = 1;
    hurtPlayer();
  }

  if (player.y > canvas.height) {
    gameOver();
  }

  player.animFrame++;
}

// 繪製精緻卡通人形角色（增強頭部輪廓與五官細節）
function drawPlayer() {
  if (player.invincibleTimer > 0 && Math.floor(player.animFrame / 4) % 2 === 0) {
    return;
  }

  ctx.save();
  ctx.translate(player.x + player.width / 2, player.y + player.height / 2);

  if (player.facing === 'left') {
    ctx.scale(-1, 1);
  }

  const isGirl = selectedGender === 'girl';
  const runCycle = Math.sin(player.animFrame * 0.3);
  const legAngle = player.isMoving ? runCycle * 0.5 : 0;
  const armAngle = player.isMoving ? -runCycle * 0.5 : 0;
  const bodyY = player.isMoving ? Math.abs(Math.sin(player.animFrame * 0.3)) * -2 : 0;

  // 無敵防護光圈
  if (player.invincibleTimer > 0) {
    ctx.beginPath();
    ctx.arc(0, bodyY, 26, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 234, 167, 0.4)';
    ctx.strokeStyle = '#ffeaa7';
    ctx.lineWidth = 2;
    ctx.fill();
    ctx.stroke();
  }

  // 雙腿
  ctx.strokeStyle = '#2f3542';
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';

  ctx.save();
  ctx.translate(-4, 10 + bodyY);
  ctx.rotate(legAngle);
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 10); ctx.stroke();
  ctx.fillStyle = isGirl ? '#ff4757' : '#3742fa';
  ctx.beginPath(); ctx.arc(2, 10, 3, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(4, 10 + bodyY);
  ctx.rotate(-legAngle);
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 10); ctx.stroke();
  ctx.fillStyle = isGirl ? '#ff4757' : '#3742fa';
  ctx.beginPath(); ctx.arc(2, 10, 3, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // 身體
  ctx.fillStyle = isGirl ? '#ff6b81' : '#70a1ff';
  ctx.beginPath();
  ctx.roundRect(-8, -4 + bodyY, 16, 16, 4);
  ctx.fill();
  // 身體外框
  ctx.strokeStyle = '#2f3542';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  if (isGirl) {
    ctx.fillStyle = '#ff4757';
    ctx.beginPath();
    ctx.moveTo(-10, 8 + bodyY); ctx.lineTo(10, 8 + bodyY);
    ctx.lineTo(12, 13 + bodyY); ctx.lineTo(-12, 13 + bodyY);
    ctx.closePath(); ctx.fill();
    ctx.stroke();
  }

  // 手臂
  ctx.save();
  ctx.translate(-6, -2 + bodyY); ctx.rotate(-armAngle);
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 9); ctx.stroke();
  ctx.restore();

  ctx.save();
  ctx.translate(6, -2 + bodyY); ctx.rotate(armAngle);
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 9); ctx.stroke();
  ctx.restore();

  // --- 頭部與五官優化 ---
  const headX = 0;
  const headY = -13 + bodyY;
  const headR = 12;

  // 頭部底色與外框
  ctx.fillStyle = '#ffeaa7';
  ctx.beginPath();
  ctx.arc(headX, headY, headR, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#2f3542';
  ctx.lineWidth = 1.8;
  ctx.stroke();

  // 眼睛（黑眼珠 + 白色高光）
  ctx.fillStyle = '#2f3542';
  ctx.beginPath();
  ctx.arc(headX + 4, headY - 1, 2.2, 0, Math.PI * 2); // 右眼
  ctx.arc(headX - 2, headY - 1, 2.2, 0, Math.PI * 2); // 左眼
  ctx.fill();

  // 眼神高光
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(headX + 4.8, headY - 1.8, 0.8, 0, Math.PI * 2);
  ctx.arc(headX - 1.2, headY - 1.8, 0.8, 0, Math.PI * 2);
  ctx.fill();

  // 可愛微笑口部
  ctx.strokeStyle = '#2f3542';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(headX + 1, headY + 3, 2.5, 0.1 * Math.PI, 0.9 * Math.PI);
  ctx.stroke();

  // 腮紅
  ctx.fillStyle = 'rgba(255, 107, 129, 0.55)';
  ctx.beginPath();
  ctx.arc(headX + 7, headY + 2, 2.8, 0, Math.PI * 2);
  ctx.arc(headX - 5, headY + 2, 2.8, 0, Math.PI * 2);
  ctx.fill();

  // 頭飾與髮型
  if (isGirl) {
    ctx.fillStyle = '#57606f';
    ctx.beginPath(); ctx.arc(headX - 1, headY - 4, 12.5, Math.PI, Math.PI * 2); ctx.fill();
    // 雙馬尾
    ctx.beginPath();
    ctx.arc(headX - 13, headY + 1 + runCycle, 5.5, 0, Math.PI * 2);
    ctx.arc(headX + 13, headY + 1 - runCycle, 5.5, 0, Math.PI * 2);
    ctx.fill();
    // 蝴蝶結
    ctx.fillStyle = '#ff4757';
    ctx.beginPath(); ctx.arc(headX, headY - 10, 3.5, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.fillStyle = '#ff4757';
    ctx.beginPath(); ctx.arc(headX, headY - 3, 13, Math.PI * 0.8, Math.PI * 2.2); ctx.fill();
    ctx.fillRect(headX + 2, headY - 6, 12, 3.5);
  }

  ctx.restore();
}

function drawPlatforms() {
  for (let p of platforms) {
    if (p.broken) continue;

    ctx.save();

    if (p.type === 'NORMAL') {
      ctx.fillStyle = '#70a1ff';
      ctx.beginPath(); ctx.roundRect(p.x, p.y, p.width, p.height, 6); ctx.fill();
      ctx.fillStyle = '#1e90ff';
      ctx.fillRect(p.x + 4, p.y + 3, p.width - 8, 3);

    } else if (p.type === 'SPRING') {
      const compressY = p.springCompress * 6;
      ctx.fillStyle = '#a4b0be';
      ctx.fillRect(p.x, p.y + p.height - 4, p.width, 4);

      ctx.strokeStyle = '#dfe4ea';
      ctx.lineWidth = 3;
      const springSegments = 3;
      const segWidth = p.width / (springSegments + 1);
      const topY = p.y + 4 + compressY;
      const bottomY = p.y + p.height - 4;

      for (let i = 1; i <= springSegments; i++) {
        const sx = p.x + i * segWidth;
        ctx.beginPath();
        ctx.moveTo(sx - 6, bottomY);
        ctx.lineTo(sx + 6, (bottomY + topY) / 2);
        ctx.lineTo(sx - 6, topY);
        ctx.stroke();
      }

      ctx.fillStyle = '#ff6b81';
      ctx.beginPath();
      ctx.roundRect(p.x, p.y + compressY, p.width, 6, 3);
      ctx.fill();

    } else if (p.type === 'CONVEYOR_LEFT' || p.type === 'CONVEYOR_RIGHT') {
      ctx.fillStyle = '#eccc68';
      ctx.beginPath(); ctx.roundRect(p.x, p.y, p.width, p.height, 8); ctx.fill();

      ctx.strokeStyle = '#ffa502';
      ctx.lineWidth = 2;
      const offset = (Date.now() / 30) % 12;
      ctx.beginPath();
      for (let x = p.x + (p.type === 'CONVEYOR_LEFT' ? offset : -offset); x < p.x + p.width; x += 12) {
        if (x >= p.x && x <= p.x + p.width - 4) {
          ctx.moveTo(x, p.y + 2); ctx.lineTo(x + 4, p.y + p.height - 2);
        }
      }
      ctx.stroke();

    } else if (p.type === 'SPIKE') {
      ctx.fillStyle = '#747d8c';
      ctx.fillRect(p.x, p.y + 8, p.width, 8);
      ctx.fillStyle = '#ff4757';
      const count = Math.floor(p.width / 10);
      for (let i = 0; i < count; i++) {
        ctx.beginPath();
        ctx.moveTo(p.x + i * 10, p.y + 8);
        ctx.lineTo(p.x + i * 10 + 5, p.y);
        ctx.lineTo(p.x + i * 10 + 10, p.y + 8);
        ctx.fill();
      }

    } else if (p.type === 'BREAK') {
      ctx.fillStyle = '#ff7f50';
      ctx.beginPath(); ctx.roundRect(p.x, p.y, p.width, p.height, 4); ctx.fill();
      ctx.strokeStyle = '#2f3542';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(p.x + 10, p.y + 2); ctx.lineTo(p.x + p.width / 2, p.y + 14);
      ctx.lineTo(p.x + p.width - 10, p.y + 2);
      ctx.stroke();

    } else if (p.type === 'HEAL') {
      ctx.fillStyle = '#2ed573';
      ctx.beginPath(); ctx.roundRect(p.x, p.y, p.width, p.height, 6); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.font = '12px sans-serif';
      ctx.fillText('❤️ 補血', p.x + p.width / 2 - 20, p.y + 12);
    }

    ctx.restore();
  }
}

function drawHUD() {
  ctx.fillStyle = '#ff4757';
  const spikeWidth = 16;
  for (let x = 0; x < canvas.width; x += spikeWidth) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x + spikeWidth / 2, 22);
    ctx.lineTo(x + spikeWidth, 0);
    ctx.fill();
  }

  for (let i = 0; i < player.maxHp; i++) {
    ctx.font = '16px sans-serif';
    if (i < player.hp) {
      ctx.fillText('❤️', 12 + i * 20, 42);
    } else {
      ctx.fillText('🖤', 12 + i * 20, 42);
    }
  }

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 18px "Comic Sans MS", sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText(`B${highestFloor} F`, canvas.width - 15, 42);
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#101828';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  drawPlatforms();
  drawPlayer();
  drawHUD();
}

function gameLoop() {
  if (gameState === 'PLAYING') {
    update();
    render();
    requestAnimationFrame(gameLoop);
  }
}

function gameOver() {
  gameState = 'GAMEOVER';
  document.getElementById('final-floor').innerText = `B${highestFloor} 層`;
  document.getElementById('gameover-menu').classList.remove('hidden');
  fetchLeaderboard();
}

async function fetchLeaderboard() {
  const lbContainer = document.getElementById('leaderboard-list');
  lbContainer.innerHTML = '<div style="color:#a4b0be; padding:10px;">載入雲端排行榜中...</div>';

  try {
    const response = await fetch(GAS_WEB_APP_URL);
    const scores = await response.json();

    if (!scores || scores.length === 0) {
      lbContainer.innerHTML = '<div style="color:#a4b0be; padding:10px;">尚無紀錄，快來挑戰吧！</div>';
      return;
    }

    lbContainer.innerHTML = scores.map((s, idx) => `
      <div class="lb-row">
        <span>${idx + 1}. ${escapeHtml(String(s.name))}</span>
        <span>B${s.floor} 層 (${s.date || ''})</span>
      </div>
    `).join('');
  } catch (err) {
    lbContainer.innerHTML = '<div style="color:#ff4757; padding:10px;">無法載入排行榜</div>';
  }
}

async function saveScore() {
  let nameInput = document.getElementById('player-name').value.trim() || '無名勇士';
  if (nameInput.length > 10) nameInput = nameInput.substring(0, 10);

  const saveBtn = document.querySelector('#gameover-menu .btn');
  saveBtn.disabled = true;
  saveBtn.innerText = '上傳中...';

  try {
    await fetch(GAS_WEB_APP_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: nameInput,
        floor: highestFloor
      })
    });

    alert('成績已成功上傳至 Google 雲端試算表！');
    setTimeout(fetchLeaderboard, 1000);
  } catch (err) {
    alert('上傳失敗，請檢查網路連線。');
  } finally {
    saveBtn.disabled = false;
    saveBtn.innerText = '紀錄成績上雲端';
  }
}

function escapeHtml(str) {
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

render();
</script>
</body>
</html>
