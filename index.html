<script>
// Google Apps Script 雲端 API 網址
const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxlAvVig_0VZJ8s6hasbKE46LMnKVYN0HCmOtjXluLEC8J-xSowe2o5nEtfs__1Pw7w/exec";

// 音效合成器
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);

  const now = audioCtx.currentTime;
  if (type === 'jump') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(300, now);
    osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
    gain.gain.setValueAtTime(0.3, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
    osc.start(now); osc.stop(now + 0.15);
  } else if (type === 'spring') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(200, now);
    osc.frequency.linearRampToValueAtTime(700, now + 0.25);
    gain.gain.setValueAtTime(0.4, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
    osc.start(now); osc.stop(now + 0.25);
  } else if (type === 'hurt') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(150, now);
    osc.frequency.linearRampToValueAtTime(60, now + 0.2);
    gain.gain.setValueAtTime(0.4, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
    osc.start(now); osc.stop(now + 0.2);
  } else if (type === 'heal') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(400, now);
    osc.frequency.setValueAtTime(600, now + 0.08);
    osc.frequency.setValueAtTime(800, now + 0.16);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
    osc.start(now); osc.stop(now + 0.25);
  }
}

if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    r = Math.min(Array.isArray(r) ? r[0] : r, w / 2, h / 2);
    this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r);
    this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r);
    this.arcTo(x, y, x + w, y, r);
    this.closePath();
  };
}

// Canvas & 遊戲狀態
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let gameState = 'MENU';
let selectedGender = 'boy';
let score = 0;
let highestFloor = 0;

// 控制變數
const GRAVITY = 0.35;
const PLAYER_SPEED = 1.9; 
const BASE_SCROLL_SPEED = 0.378; 
let currentScrollSpeed = BASE_SCROLL_SPEED;

let keys = { left: false, right: false };

let player = {
  x: 210,
  y: 100,
  vx: 0,
  vy: 0,
  width: 32,
  height: 44,
  hp: 3,
  maxHp: 9,
  invincibleTimer: 0, 
  onPlatform: null,
  facing: 'right',
  animFrame: 0,
  isMoving: false
};

let platforms = [];

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'arrowleft' || k === 'a') keys.left = true;
  if (k === 'arrowright' || k === 'd') keys.right = true;
});
window.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (k === 'arrowleft' || k === 'a') keys.left = false;
  if (k === 'arrowright' || k === 'd') keys.right = false;
});
window.addEventListener('blur', () => { keys.left = keys.right = false; });

const btnLeft = document.getElementById('btn-left');
const btnRight = document.getElementById('btn-right');
function bindHold(el, key) {
  el.addEventListener('pointerdown', e => { e.preventDefault(); keys[key] = true; });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => el.addEventListener(ev, () => { keys[key] = false; }));
}
bindHold(btnLeft, 'left');
bindHold(btnRight, 'right');

function selectChar(gender) {
  selectedGender = gender;
  document.getElementById('opt-boy').classList.toggle('selected', gender === 'boy');
  document.getElementById('opt-girl').classList.toggle('selected', gender === 'girl');
}

function startGame() {
  document.getElementById('start-menu').classList.add('hidden');
  document.getElementById('gameover-menu').classList.add('hidden');
  resetGame();
  gameState = 'PLAYING';
  startLoop();
}

function restartGame() {
  document.getElementById('gameover-menu').classList.add('hidden');
  resetGame();
  gameState = 'PLAYING';
  startLoop();
}

function resetGame() {
  score = 0;
  keys.left = keys.right = false;
  player.facing = 'right';
  player.isMoving = false;
  highestFloor = 1;
  currentScrollSpeed = BASE_SCROLL_SPEED;
  
  player.x = 210;
  player.y = 80;
  player.vx = 0;
  player.vy = 0;
  player.hp = 3;
  player.invincibleTimer = 0;
  player.onPlatform = null;
  player.ignorePlatform = null;

  platforms = [];
  platforms.push({
    x: 180,
    y: 180,
    width: 100,
    height: 16,
    type: 'NORMAL',
    floor: 1,
    springCompress: 0
  });

  let lastY = 180;
  for (let i = 2; i <= 8; i++) {
    lastY += 75;
    generatePlatform(lastY, i);
  }
}

function generatePlatform(yPos, floorNum) {
  const width = Math.random() * 20 + 85;
  const x = Math.random() * (canvas.width - width - 40) + 20;
  
  let type = 'NORMAL';
  const rand = Math.random();
  if (rand < 0.35) type = 'NORMAL';
  else if (rand < 0.50) type = 'SPRING';
  else if (rand < 0.65) type = 'CONVEYOR_LEFT';
  else if (rand < 0.80) type = 'CONVEYOR_RIGHT';
  else if (rand < 0.90) type = 'SPIKE';
  else if (rand < 0.96) type = 'BREAK';
  else type = 'HEAL';

  platforms.push({
    x: x,
    y: yPos,
    width: width,
    height: 16,
    type: type,
    floor: floorNum,
    broken: false,
    springCompress: 0
  });
}

function hurtPlayer() {
  if (player.invincibleTimer > 0) return;
  player.hp--;
  player.invincibleTimer = 180; 
  playSound('hurt');

  if (player.hp <= 0) {
    gameOver();
  }
}

function update() {
  if (gameState !== 'PLAYING') return;

  player.isMoving = false;
  if (keys.left) {
    player.vx = -PLAYER_SPEED;
    player.facing = 'left';
    player.isMoving = true;
  } else if (keys.right) {
    player.vx = PLAYER_SPEED;
    player.facing = 'right';
    player.isMoving = true;
  } else {
    player.vx = 0;
  }

  player.x += player.vx;
  if (player.x < 10) player.x = 10;
  if (player.x + player.width > canvas.width - 10) player.x = canvas.width - 10 - player.width;

  player.vy += GRAVITY;
  player.y += player.vy;

  if (player.invincibleTimer > 0) {
    player.invincibleTimer--;
  }

  const tier = Math.floor(highestFloor / 20); // 每 20 層升一級難度
  currentScrollSpeed = (BASE_SCROLL_SPEED + Math.min(highestFloor * 0.01, 0.5)) * 2.3 * (1 + tier * 0.2); // 上升速度 +30%，每 20 層再 +20%
  
  let wasOnPlatform = player.onPlatform;
  player.onPlatform = null;

  for (let p of platforms) {
    if (p.springCompress > 0) {
      p.springCompress -= 0.1;
      if (p.springCompress < 0) p.springCompress = 0;
    }

    if (p.broken) continue;

    // 被頂到天花板的那塊平台：先穿過它掉下去，避免卡在頂部
    if (p === player.ignorePlatform) {
      if (player.y > p.y + p.height) player.ignorePlatform = null;
      else continue;
    }

    if (
      player.vy >= 0 &&
      player.x + player.width > p.x &&
      player.x < p.x + p.width &&
      player.y + player.height >= p.y &&
      player.y + player.height <= p.y + p.height + player.vy + 2
    ) {
      player.y = p.y - player.height;
      player.vy = 0;
      player.onPlatform = p;

      if (p.floor > highestFloor) {
        highestFloor = p.floor;
      }

      if (wasOnPlatform !== p) {
        if (p.type === 'SPRING') {
          p.springCompress = 1.0; 
          player.vy = -9.5;
          playSound('spring');
        } else if (p.type === 'SPIKE') {
          hurtPlayer();
        } else if (p.type === 'BREAK') {
          p.broken = true;
          playSound('hurt');
        } else if (p.type === 'HEAL') {
          if (player.hp < player.maxHp) {
            player.hp = Math.min(player.maxHp, player.hp + 2);
            playSound('heal');
          }
          p.type = 'NORMAL';
        }
      }

      if (p.type === 'CONVEYOR_LEFT') player.x -= 1.2;
      if (p.type === 'CONVEYOR_RIGHT') player.x += 1.2;

      break;
    }
  }

  for (let p of platforms) {
    p.y -= currentScrollSpeed;
  }
  player.y -= currentScrollSpeed;

  if (platforms.length > 0 && platforms[0].y < -30) {
    platforms.shift();
  }

  let lastP = platforms[platforms.length - 1];
  if (lastP.y < canvas.height - 60) {
    generatePlatform(lastP.y + 75 + Math.random() * 15, lastP.floor + 1);
  }

  if (player.y <= 24) {
    player.y = 25;
    player.vy = 3;                       // 被彈下去
    if (player.onPlatform) player.ignorePlatform = player.onPlatform;
    hurtPlayer();
  }

  if (player.y > canvas.height) {
    gameOver();
  }

  player.animFrame++;
}

// 忍者風格角色（原創設計：護額、忍者裝、飄動的圍巾/髮束）
function drawNinja(c, girl, frame, moving) {
  const rc = Math.sin(frame * 0.3);
  const leg = moving ? rc * 0.5 : 0, arm = moving ? -rc * 0.5 : 0;
  const by = moving ? Math.abs(rc) * -2 : Math.sin(frame * 0.08) * -0.6;
  const wv = Math.sin(frame * 0.25) * 3;
  const skin = '#ffe0bd', line = '#2f3542';
  const cloth = girl ? '#c0392b' : '#2d3a8c';
  const pants = girl ? '#2f3542' : '#1e2761';
  const hair = girl ? '#3d2c5a' : '#4a3426';
  const band = girl ? '#e84393' : '#1e90ff';
  const T = Math.PI * 2;
  c.lineCap = 'round'; c.lineJoin = 'round';

  // 雙腿（繃帶 + 忍者鞋）
  for (const s of [-1, 1]) {
    c.save(); c.translate(4 * s, 10 + by); c.rotate(-leg * s);
    c.strokeStyle = pants; c.lineWidth = 4.5;
    c.beginPath(); c.moveTo(0, 0); c.lineTo(0, 10); c.stroke();
    c.fillStyle = '#f5f6fa'; c.fillRect(-2.2, 5, 4.4, 3);
    c.fillStyle = line; c.beginPath(); c.arc(1.5, 10.5, 3, 0, T); c.fill();
    c.restore();
  }
  // 身後飄動的圍巾 / 腰帶尾
  const ty = (girl ? 9 : -3) + by;
  c.strokeStyle = girl ? '#ffeaa7' : '#ecf0f1'; c.lineWidth = 3.5;
  c.beginPath(); c.moveTo(-6, ty); c.quadraticCurveTo(-14, ty + wv, -21, ty - wv + 2); c.stroke();

  // 身體
  c.fillStyle = cloth; c.strokeStyle = line; c.lineWidth = 1.5;
  c.beginPath(); c.roundRect(-8, -4 + by, 16, 16, 4); c.fill(); c.stroke();
  if (girl) {
    c.fillStyle = pants;
    c.beginPath(); c.moveTo(-9, 9 + by); c.lineTo(9, 9 + by); c.lineTo(11, 14 + by); c.lineTo(-11, 14 + by); c.closePath(); c.fill(); c.stroke();
    c.fillStyle = '#ffeaa7'; c.fillRect(-8, 7 + by, 16, 3);
  } else {
    c.fillStyle = '#1e2761'; c.fillRect(-8, -4 + by, 16, 4);
    c.strokeStyle = '#f5f6fa'; c.lineWidth = 1.2;
    c.beginPath(); c.moveTo(0, 0 + by); c.lineTo(0, 8 + by); c.stroke();
    c.fillStyle = '#ecf0f1'; c.fillRect(-4.5, -5.5 + by, 9, 3);
    c.fillStyle = line; c.fillRect(-8, 8 + by, 16, 2.5);
  }
  // 苦無袋
  c.fillStyle = '#95a5a6'; c.strokeStyle = line; c.lineWidth = 1;
  c.beginPath(); c.roundRect(5, 9 + by, 6, 6, 1.5); c.fill(); c.stroke();

  // 手臂（袖子 + 護腕 + 手）
  for (const s of [-1, 1]) {
    c.save(); c.translate(6 * s, -2 + by); c.rotate(arm * s);
    c.strokeStyle = cloth; c.lineWidth = 4;
    c.beginPath(); c.moveTo(0, 0); c.lineTo(0, 7); c.stroke();
    c.fillStyle = '#f5f6fa'; c.fillRect(-2.2, 5, 4.4, 2.5);
    c.fillStyle = skin; c.beginPath(); c.arc(0, 9.5, 2.3, 0, T); c.fill();
    c.restore();
  }

  // 頭部
  const hy = -13 + by, R = 12;
  if (girl) { // 長馬尾
    c.strokeStyle = hair; c.lineWidth = 6;
    c.beginPath(); c.moveTo(-9, hy - 3); c.quadraticCurveTo(-19, hy + 2 + rc * 3, -17, hy + 16 + rc * 3); c.stroke();
  }
  c.fillStyle = band; // 護額布尾
  c.beginPath(); c.moveTo(-11, hy - 6); c.lineTo(-21, hy - 9 + wv); c.lineTo(-19, hy - 3 + wv); c.lineTo(-11, hy - 3); c.fill();

  c.fillStyle = skin; c.strokeStyle = line; c.lineWidth = 1.8;
  c.beginPath(); c.arc(0, hy, R, 0, T); c.fill(); c.stroke();

  // 眼睛
  const ry = girl ? 2.6 : 2.2;
  c.fillStyle = line;
  c.beginPath(); c.ellipse(4.5, hy + 2, 1.8, ry, 0, 0, T); c.ellipse(-2, hy + 2, 1.8, ry, 0, 0, T); c.fill();
  c.fillStyle = '#fff';
  c.beginPath(); c.arc(5.2, hy + 1, 0.8, 0, T); c.arc(-1.3, hy + 1, 0.8, 0, T); c.fill();
  c.strokeStyle = line; c.lineWidth = 1.3;
  if (girl) { // 睫毛 + 小嘴
    c.beginPath(); c.moveTo(6.2, hy); c.lineTo(7.8, hy - 1.3); c.moveTo(-3.2, hy); c.lineTo(-4.8, hy - 1.3); c.stroke();
    c.beginPath(); c.arc(1.5, hy + 6, 1.8, 0.15 * Math.PI, 0.85 * Math.PI); c.stroke();
  } else {    // 自信笑容
    c.beginPath(); c.arc(1.5, hy + 5.5, 2.8, 0.1 * Math.PI, 0.9 * Math.PI); c.stroke();
  }
  c.fillStyle = 'rgba(255,107,129,0.5)';
  c.beginPath(); c.arc(8, hy + 5, 2.2, 0, T); c.arc(-5.5, hy + 5, 2.2, 0, T); c.fill();

  // 頭髮
  c.fillStyle = hair;
  c.beginPath(); c.arc(-0.5, hy - 3, R + 0.8, Math.PI, T); c.closePath(); c.fill();
  if (girl) {
    c.beginPath(); c.moveTo(8, hy - 8); c.lineTo(12.5, hy + 6); c.lineTo(7, hy - 3); c.closePath(); c.fill();
    c.fillStyle = band; c.beginPath(); c.arc(-9.5, hy - 3, 2.3, 0, T); c.fill();
  } else {    // 刺刺頭
    for (let i = 0; i < 5; i++) {
      const bx = -11 + i * 5.5;
      c.beginPath(); c.moveTo(bx, hy - 9); c.lineTo(bx + 2.75 + (i - 2) * 1.2, hy - 17 - (i % 2) * 3); c.lineTo(bx + 5.5, hy - 9); c.closePath(); c.fill();
    }
  }
  // 護額
  c.save(); c.beginPath(); c.arc(0, hy, R, 0, T); c.clip();
  c.fillStyle = band; c.fillRect(-R, hy - 7, R * 2, 4.2); c.restore();
  c.fillStyle = '#dfe6e9'; c.strokeStyle = line; c.lineWidth = 1;
  c.beginPath(); c.roundRect(0.5, hy - 7.6, 9.5, 5.4, 1.2); c.fill(); c.stroke();
  c.beginPath(); c.moveTo(3, hy - 4.9); c.lineTo(7.8, hy - 4.9); c.stroke();
}

function drawPlayer() {
  if (player.invincibleTimer > 0 && Math.floor(player.animFrame / 4) % 2 === 0) return;
  ctx.save();
  ctx.translate(player.x + player.width / 2, player.y + player.height / 2);
  if (player.facing === 'left') ctx.scale(-1, 1);
  if (player.invincibleTimer > 0) {
    ctx.beginPath(); ctx.arc(0, 0, 26, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 234, 167, 0.4)'; ctx.strokeStyle = '#ffeaa7'; ctx.lineWidth = 2;
    ctx.fill(); ctx.stroke();
  }
  drawNinja(ctx, selectedGender === 'girl', player.animFrame, player.isMoving);
  ctx.restore();
}

function drawPreviews(t) {
  for (const g of ['boy', 'girl']) {
    const cv = document.getElementById('pv-' + g), c = cv.getContext('2d');
    c.clearRect(0, 0, cv.width, cv.height);
    c.save(); c.translate(38, 56); c.scale(1.6, 1.6);
    drawNinja(c, g === 'girl', t / 16, false);
    c.restore();
  }
}
function previewLoop(t) {
  if (gameState === 'MENU') { drawPreviews(t); requestAnimationFrame(previewLoop); }
}

function drawPlatforms() {
  for (let p of platforms) {
    if (p.broken) continue;

    ctx.save();

    if (p.type === 'NORMAL') {
      ctx.fillStyle = '#70a1ff';
      ctx.beginPath(); ctx.roundRect(p.x, p.y, p.width, p.height, 6); ctx.fill();
      ctx.fillStyle = '#1e90ff';
      ctx.fillRect(p.x + 4, p.y + 3, p.width - 8, 3);

    } else if (p.type === 'SPRING') {
      const compressY = p.springCompress * 6;
      ctx.fillStyle = '#a4b0be';
      ctx.fillRect(p.x, p.y + p.height - 4, p.width, 4);

      ctx.strokeStyle = '#dfe4ea';
      ctx.lineWidth = 3;
      const springSegments = 3;
      const segWidth = p.width / (springSegments + 1);
      const topY = p.y + 4 + compressY;
      const bottomY = p.y + p.height - 4;

      for (let i = 1; i <= springSegments; i++) {
        const sx = p.x + i * segWidth;
        ctx.beginPath();
        ctx.moveTo(sx - 6, bottomY);
        ctx.lineTo(sx + 6, (bottomY + topY) / 2);
        ctx.lineTo(sx - 6, topY);
        ctx.stroke();
      }

      ctx.fillStyle = '#ff6b81';
      ctx.beginPath();
      ctx.roundRect(p.x, p.y + compressY, p.width, 6, 3);
      ctx.fill();

    } else if (p.type === 'CONVEYOR_LEFT' || p.type === 'CONVEYOR_RIGHT') {
      ctx.fillStyle = '#eccc68';
      ctx.beginPath(); ctx.roundRect(p.x, p.y, p.width, p.height, 8); ctx.fill();

      ctx.strokeStyle = '#ffa502';
      ctx.lineWidth = 2;
      const offset = (Date.now() / 30) % 12;
      ctx.beginPath();
      for (let x = p.x + (p.type === 'CONVEYOR_LEFT' ? offset : -offset); x < p.x + p.width; x += 12) {
        if (x >= p.x && x <= p.x + p.width - 4) {
          ctx.moveTo(x, p.y + 2); ctx.lineTo(x + 4, p.y + p.height - 2);
        }
      }
      ctx.stroke();

    } else if (p.type === 'SPIKE') {
      ctx.fillStyle = '#747d8c';
      ctx.fillRect(p.x, p.y + 8, p.width, 8);
      ctx.fillStyle = '#ff4757';
      const count = Math.floor(p.width / 10);
      for (let i = 0; i < count; i++) {
        ctx.beginPath();
        ctx.moveTo(p.x + i * 10, p.y + 8);
        ctx.lineTo(p.x + i * 10 + 5, p.y);
        ctx.lineTo(p.x + i * 10 + 10, p.y + 8);
        ctx.fill();
      }

    } else if (p.type === 'BREAK') {
      ctx.fillStyle = '#ff7f50';
      ctx.beginPath(); ctx.roundRect(p.x, p.y, p.width, p.height, 4); ctx.fill();
      ctx.strokeStyle = '#2f3542';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(p.x + 10, p.y + 2); ctx.lineTo(p.x + p.width / 2, p.y + 14);
      ctx.lineTo(p.x + p.width - 10, p.y + 2);
      ctx.stroke();

    } else if (p.type === 'HEAL') {
      ctx.fillStyle = '#2ed573';
      ctx.beginPath(); ctx.roundRect(p.x, p.y, p.width, p.height, 6); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('❤️ 補血', p.x + p.width / 2, p.y + 12);
    }

    ctx.restore();
  }
}

function drawHUD() {
  ctx.save();
  ctx.textAlign = 'left';
  ctx.fillStyle = '#ff4757';
  const spikeWidth = 16;
  for (let x = 0; x < canvas.width; x += spikeWidth) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x + spikeWidth / 2, 22);
    ctx.lineTo(x + spikeWidth, 0);
    ctx.fill();
  }

  for (let i = 0; i < player.maxHp; i++) {
    ctx.font = '16px sans-serif';
    if (i < player.hp) {
      ctx.fillText('❤️', 12 + i * 20, 42);
    } else {
      ctx.fillText('🖤', 12 + i * 20, 42);
    }
  }

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 18px "Comic Sans MS", sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText(`B${highestFloor} F`, canvas.width - 15, 42);
  ctx.restore();
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#101828';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  drawPlatforms();
  drawPlayer();
  drawHUD();
}

let scoreSaved = false, loopId = 0, lastTime = 0, acc = 0;
const STEP = 1000 / 60;

function startLoop() {
  cancelAnimationFrame(loopId);
  lastTime = 0; acc = 0;
  loopId = requestAnimationFrame(gameLoop);
}

function gameLoop(ts) {
  if (gameState !== 'PLAYING') return;
  if (!lastTime) lastTime = ts;
  acc += Math.min(ts - lastTime, 100);
  lastTime = ts;
  try {
    while (acc >= STEP && gameState === 'PLAYING') { update(); acc -= STEP; }
    render();
  } catch (err) { console.error(err); }
  if (gameState === 'PLAYING') loopId = requestAnimationFrame(gameLoop);
}

function gameOver() {
  if (gameState === 'GAMEOVER') return;
  gameState = 'GAMEOVER';
  player.hp = Math.max(0, player.hp);
  keys.left = keys.right = false;
  scoreSaved = false;
  const saveBtn = document.querySelector('#gameover-menu .btn');
  saveBtn.disabled = false;
  saveBtn.innerText = '紀錄成績上雲端';
  document.getElementById('final-floor').innerText = `B${highestFloor} 層`;
  document.getElementById('gameover-menu').classList.remove('hidden');
  fetchLeaderboard();
}

async function fetchLeaderboard() {
  const lbContainer = document.getElementById('leaderboard-list');
  lbContainer.innerHTML = '<div style="color:#a4b0be; padding:10px;">載入雲端排行榜中...</div>';

  try {
    const response = await fetch(GAS_WEB_APP_URL);
    const scores = await response.json();

    if (!scores || scores.length === 0) {
      lbContainer.innerHTML = '<div style="color:#a4b0be; padding:10px;">尚無紀錄，快來挑戰吧！</div>';
      return;
    }

    lbContainer.innerHTML = scores.map((s, idx) => `
      <div class="lb-row">
        <span>${idx + 1}. ${escapeHtml(String(s.name))}</span>
        <span>B${s.floor} 層 (${s.date || ''})</span>
      </div>
    `).join('');
  } catch (err) {
    lbContainer.innerHTML = '<div style="color:#ff4757; padding:10px;">無法載入排行榜</div>';
  }
}

async function saveScore() {
  if (scoreSaved) return;
  let nameInput = document.getElementById('player-name').value.trim() || '無名勇士';
  if (nameInput.length > 10) nameInput = nameInput.substring(0, 10);

  const saveBtn = document.querySelector('#gameover-menu .btn');
  saveBtn.disabled = true;
  saveBtn.innerText = '上傳中...';

  try {
    await fetch(GAS_WEB_APP_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: nameInput,
        floor: highestFloor
      })
    });

    scoreSaved = true;
    alert('成績已成功上傳至 Google 雲端試算表！');
    setTimeout(fetchLeaderboard, 1000);
  } catch (err) {
    alert('上傳失敗，請檢查網路連線。');
  } finally {
    saveBtn.disabled = scoreSaved;
    saveBtn.innerText = scoreSaved ? '已上傳 ✔' : '紀錄成績上雲端';
  }
}

function escapeHtml(str) {
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

render();
requestAnimationFrame(previewLoop);
</script>
